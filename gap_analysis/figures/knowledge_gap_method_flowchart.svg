<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24324A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#53657D"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#3678C9"/>
    </marker>
    <style>
      .title { font: 700 38px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17243A; }
      .subtitle { font: 400 18px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #607089; }
      .stage-title { font: 700 23px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17243A; }
      .step { font: 700 18px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #FFFFFF; }
      .body { font: 400 17px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #35465E; }
      .body-strong { font: 600 17px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #24354E; }
      .file { font: 600 15px "Noto Sans Mono CJK SC", "Noto Sans Mono", monospace; fill: #44546B; }
      .small { font: 400 15px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64758D; }
      .review-title { font: 700 21px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #164C3B; }
      .review-body { font: 400 17px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #2D5D50; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#F6F8FC"/>
  <circle cx="83" cy="70" r="27" fill="#3678C9"/>
  <path d="M70 70h26M83 57v26" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <text x="125" y="72" class="title">KnowledgeLog 领域知识发现方法：基础流程</text>
  <text x="125" y="108" class="subtitle">从日志解析错误中识别知识缺口、分类错误并提取可审核的领域知识候选</text>

  <!-- connectors behind cards -->
  <path d="M365 410 H408" stroke="#53657D" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M735 410 H778" stroke="#53657D" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1105 410 H1148" stroke="#53657D" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- stage 1 -->
  <rect x="55" y="160" width="310" height="510" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="55" y="160" width="310" height="82" rx="24" fill="#E8F2FF"/>
  <rect x="55" y="218" width="310" height="24" fill="#E8F2FF"/>
  <circle cx="98" cy="201" r="25" fill="#3678C9"/>
  <text x="98" y="208" text-anchor="middle" class="step">1</text>
  <text x="137" y="208" class="stage-title">数据与基础解析</text>

  <rect x="82" y="273" width="256" height="82" rx="14" fill="#F3F8FF" stroke="#B9D5F6" stroke-width="2"/>
  <text x="103" y="305" class="body-strong">采样日志消息</text>
  <text x="103" y="334" class="small">32-shot / 64-shot 等实验输入</text>

  <rect x="82" y="373" width="256" height="82" rx="14" fill="#F3F8FF" stroke="#B9D5F6" stroke-width="2"/>
  <text x="103" y="405" class="body-strong">真实日志模板</text>
  <text x="103" y="434" class="small">Ground-truth template</text>

  <rect x="82" y="473" width="256" height="116" rx="14" fill="#F3EEFF" stroke="#C9B9F3" stroke-width="2"/>
  <text x="103" y="505" class="body-strong">基础 LLM 日志解析</text>
  <text x="103" y="534" class="body">本地 Llama 或在线 API</text>
  <text x="103" y="563" class="body">生成 parsed_template</text>

  <text x="82" y="628" class="small">输入：log_message + ground_truth</text>

  <!-- stage 2 -->
  <rect x="425" y="160" width="310" height="510" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="425" y="160" width="310" height="82" rx="24" fill="#FFF1E3"/>
  <rect x="425" y="218" width="310" height="24" fill="#FFF1E3"/>
  <circle cx="468" cy="201" r="25" fill="#E68A2E"/>
  <text x="468" y="208" text-anchor="middle" class="step">2</text>
  <text x="507" y="208" class="stage-title">知识缺口识别</text>

  <text x="456" y="286" class="body-strong">比较三类信息</text>
  <text x="456" y="323" class="body">• 原始日志消息</text>
  <text x="456" y="356" class="body">• LLM 解析模板</text>
  <text x="456" y="389" class="body">• 真实日志模板</text>

  <rect x="452" y="421" width="256" height="74" rx="13" fill="#FFF8F0" stroke="#F2C48E" stroke-width="2"/>
  <text x="473" y="451" class="body-strong">Abstract 差异</text>
  <text x="473" y="478" class="small">真实模板要求抽象的变量</text>

  <rect x="452" y="511" width="256" height="74" rx="13" fill="#FFF8F0" stroke="#F2C48E" stroke-width="2"/>
  <text x="473" y="541" class="body-strong">Preserve 差异</text>
  <text x="473" y="568" class="small">LLM 错误抽象的模板常量</text>

  <rect x="452" y="607" width="256" height="38" rx="10" fill="#F3F5F8"/>
  <text x="580" y="632" text-anchor="middle" class="file">IR_results.json</text>

  <!-- stage 3 -->
  <rect x="795" y="160" width="310" height="510" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="795" y="160" width="310" height="82" rx="24" fill="#F0ECFF"/>
  <rect x="795" y="218" width="310" height="24" fill="#F0ECFF"/>
  <circle cx="838" cy="201" r="25" fill="#7756C5"/>
  <text x="838" y="208" text-anchor="middle" class="step">3</text>
  <text x="877" y="208" class="stage-title">解析错误分类</text>

  <text x="826" y="286" class="body-strong">输入分类证据</text>
  <text x="826" y="323" class="body">• 完整日志与两个模板</text>
  <text x="826" y="356" class="body">• Abstract / Preserve 片段</text>
  <text x="826" y="389" class="body">• 预定义错误分类体系</text>

  <rect x="822" y="421" width="256" height="112" rx="13" fill="#F8F5FF" stroke="#CBBEF0" stroke-width="2"/>
  <text x="843" y="451" class="body-strong">LLM 分类 + 代码校验</text>
  <text x="843" y="481" class="small">输出细粒度标签</text>
  <text x="843" y="509" class="small">代码补全父级分类</text>

  <text x="826" y="568" class="body">同类错误组织为知识证据</text>

  <rect x="822" y="607" width="256" height="38" rx="10" fill="#F3F5F8"/>
  <text x="950" y="632" text-anchor="middle" class="file">classification_results.json</text>

  <!-- stage 4 -->
  <rect x="1165" y="160" width="380" height="510" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="1165" y="160" width="380" height="82" rx="24" fill="#E8F7F1"/>
  <rect x="1165" y="218" width="380" height="24" fill="#E8F7F1"/>
  <circle cx="1208" cy="201" r="25" fill="#2F9A75"/>
  <text x="1208" y="208" text-anchor="middle" class="step">4</text>
  <text x="1247" y="208" class="stage-title">领域知识提取</text>

  <text x="1196" y="286" class="body-strong">按类别与差异片段提取</text>

  <rect x="1192" y="316" width="326" height="88" rx="13" fill="#F1FBF7" stroke="#A8DCC8" stroke-width="2"/>
  <text x="1213" y="348" class="body-strong">自然语言 Prompt 规则</text>
  <text x="1213" y="377" class="small">说明什么应抽象、什么应保留</text>

  <rect x="1192" y="421" width="326" height="88" rx="13" fill="#F1FBF7" stroke="#A8DCC8" stroke-width="2"/>
  <text x="1213" y="453" class="body-strong">预处理正则候选</text>
  <text x="1213" y="482" class="small">证据匹配 + 合成负例安全检查</text>

  <text x="1196" y="548" class="body">格式校验 · 简单审核 · 去重</text>

  <rect x="1192" y="590" width="326" height="55" rx="10" fill="#F3F5F8"/>
  <text x="1355" y="613" text-anchor="middle" class="file">domain_knowledge_for_review.json</text>
  <text x="1355" y="634" text-anchor="middle" class="small">自然语言规则 + 正则候选</text>

  <!-- bottom review loop -->
  <path d="M1355 671 V724" stroke="#53657D" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="925" y="748" width="620" height="145" rx="24" fill="#E9F8F1" stroke="#9ED7C1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="972" cy="795" r="25" fill="#278A68"/>
  <path d="M960 795l8 8 17-20" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1010" y="789" class="review-title">人工审核与知识应用</text>
  <text x="1010" y="824" class="review-body">接受 / 修改 / 删除候选知识</text>
  <text x="1010" y="855" class="review-body">将审核后的知识加入 KnowledgeLog，再进行日志解析与评估</text>

  <path d="M925 820 H688 C620 820 580 778 580 710 V685" stroke="#3678C9" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#arrow-blue)"/>
  <rect x="180" y="772" width="520" height="92" rx="18" fill="#EEF5FD" stroke="#B7D1EF" stroke-width="2"/>
  <text x="440" y="808" text-anchor="middle" class="body-strong">迭代验证</text>
  <text x="440" y="839" text-anchor="middle" class="small">比较加入候选知识前后的日志解析结果</text>

  <rect x="55" y="930" width="1490" height="42" rx="12" fill="#EAF0F7"/>
  <text x="800" y="957" text-anchor="middle" class="small">实验边界：仅使用采样日志及其真实模板生成候选知识；最终知识需经过人工审核</text>
</svg>
